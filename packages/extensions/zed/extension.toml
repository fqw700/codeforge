id = "codeforge"
name = "CodeForge"
description = "The open source coding agent."
version = "1.3.3"
schema_version = 1
authors = ["Anomaly"]
repository = "https://github.com/YOUR_ORG/codeforge"

[agent_servers.codeforge]
name = "CodeForge"
icon = "./icons/codeforge.svg"

[agent_servers.codeforge.targets.darwin-aarch64]
archive = "https://github.com/YOUR_ORG/codeforge/releases/download/v1.3.3/codeforge-darwin-arm64.zip"
cmd = "./codeforge"
args = ["acp"]

[agent_servers.codeforge.targets.darwin-x86_64]
archive = "https://github.com/YOUR_ORG/codeforge/releases/download/v1.3.3/codeforge-darwin-x64.zip"
cmd = "./codeforge"
args = ["acp"]

[agent_servers.codeforge.targets.linux-aarch64]
archive = "https://github.com/YOUR_ORG/codeforge/releases/download/v1.3.3/codeforge-linux-arm64.tar.gz"
cmd = "./codeforge"
args = ["acp"]

[agent_servers.codeforge.targets.linux-x86_64]
archive = "https://github.com/YOUR_ORG/codeforge/releases/download/v1.3.3/codeforge-linux-x64.tar.gz"
cmd = "./codeforge"
args = ["acp"]

[agent_servers.codeforge.targets.windows-x86_64]
archive = "https://github.com/YOUR_ORG/codeforge/releases/download/v1.3.3/codeforge-windows-x64.zip"
cmd = "./codeforge.exe"
args = ["acp"]
